services:
  tech-daily-weekly:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-http://localhost:8080}
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 8080
      AUTO_PUBLISH: "false"
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - report-content:/app/src/content
      - report-data:/app/.data
      - report-cache:/app/.cache
    restart: unless-stopped

volumes:
  report-content:
  report-data:
  report-cache:
